apiVersion: apps/v1
kind: Deployment
metadata: # kpt-merge: /my-nginx
  annotations:
    internal.kpt.dev/upstream-identifier: apps/v1|Deployment|koina|my-nginx
  name: my-nginx
  namespace: koina
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        team: team hla
        environment: prod
        app.kubernetes.io/managed-by: gcp-cloud-build-deploy
    spec:
      containers:
        - name: nginx
          image: "nginx:1.18.0"
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
